<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diario de Estudio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contenedor">
    <header class="cabecera">
      <h1>Diario de Estudio</h1>
      <p class="subtitulo">Registra tus sesiones y mantén tu racha.</p>
    </header>

    <section class="racha">
      <!-- Llama dibujada (marca de la racha, en lugar de un emoji) -->
      <span class="racha-marca" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M12.963 2.286a.75.75 0 0 0-1.071-.136 9.742 9.742 0 0 0-3.539 6.176 7.547 7.547 0 0 1-1.705-1.715.75.75 0 0 0-1.152-.082A9 9 0 1 0 15.68 4.534a7.46 7.46 0 0 1-2.717-2.248ZM15.75 14.25a3.75 3.75 0 1 1-7.313-1.172c.628.465 1.35.81 2.133 1a5.99 5.99 0 0 1 1.925-3.546 3.75 3.75 0 0 1 3.255 3.718Z" clip-rule="evenodd"/>
        </svg>
      </span>
      <div class="racha-numero" id="rachaNumero">0</div>
      <p class="racha-texto" id="rachaTexto">días seguidos</p>
      <div class="racha-detalles">
        <p class="racha-mejor" id="mejorRacha">Mejor racha: 0 días</p>
        <p class="racha-semana" id="minutosSemana"></p>
      </div>
    </section>

    <section class="panel">
      <h2>Nueva sesión</h2>
      <form id="formSesion" novalidate>
        <div class="campo">
          <label for="fecha">Fecha</label>
          <input type="date" id="fecha" name="fecha" required>
        </div>

        <div class="campo">
          <label for="tema">Tema</label>
          <input type="text" id="tema" name="tema" placeholder="Ej. Matemáticas" required>
        </div>

        <div class="campo">
          <label for="minutos">Minutos</label>
          <input type="number" id="minutos" name="minutos" min="1" placeholder="Ej. 30" required>
        </div>

        <button type="submit" class="boton">Guardar sesión</button>
      </form>
    </section>

    <section class="panel">
      <h2>Mis sesiones</h2>
      <ul class="lista" id="listaSesiones"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
